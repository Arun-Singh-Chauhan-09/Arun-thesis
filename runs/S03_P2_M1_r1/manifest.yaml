apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
 _config.yaml: |
    logging:
      level: DEBUG
    server:
      port: 8080

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: config-app
  template:
    metadata:
      labels:
        app: config-app
    spec:
      containers:
      - name: app
        image: busybox
        command: ["sh",  "-c"]
        args:
        - echo $(CONFIG_LOGGING_LEVEL) $(CONFIG_SERVER_PORT)
        env:
        - name: CONFIG_LOGGING_LEVEL
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: logging.level
        - name: CONFIG_SERVER_PORT
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: server.port
        volumeMounts:
        - name: config
          mountPath: /config
      volumes:
      - name: config
        configMap:
          name: app-config
