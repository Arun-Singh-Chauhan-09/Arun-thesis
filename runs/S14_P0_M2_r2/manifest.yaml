---
apiVersion: v1
kind: Pod
metadata:
  name: log-tailer-pod
spec:
  volumes:
    - name: shared-log
      emptyDir: {}
  containers:
    - name: main-app
      image: busybox:1.36
      command: ["/bin/sh", "-c"]
      args:
        - |
          while true; do
            echo "$(date) - log entry from main container" >> /var/log/app.log
            sleep 5
          done
      volumeMounts:
        - name: shared-log
          mountPath: /var/log
    - name: sidecar-tailer
      image: busybox:1.36
      command: ["/bin/sh", "-c"]
      args:
        - |
          tail -F /var/log/app.log
      volumeMounts:
        - name: shared-log
          mountPath: /var/log
