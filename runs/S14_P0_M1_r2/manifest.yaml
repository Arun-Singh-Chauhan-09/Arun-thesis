apiVersion: v1
kind: Pod
metadata:
  name: multi-container-pod
spec:
  containers:
  - name: main-container
    image: busybox
    volumeMounts:
    - name: logs
      mountPath: /logs
    command: ["sh", "-c"]
    args:
    - while true; do echo "$(date)" >> /logs/log.txt; sleep 1; done
  - name: sidecar-container
    image: busybox
    volumeMounts:
    - name: logs
      mountPath: /logs
    command: ["sh", "-c"]
    args:
    - tail -f /logs/log.txt
  volumes:
  - name: logs
    emptyDir: {}
---
