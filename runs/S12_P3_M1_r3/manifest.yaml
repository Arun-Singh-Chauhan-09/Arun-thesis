apiVersion: apps/v1
kind: Deployment
metadata:
  name: healthz-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: healthz-app
  template:
    metadata:
      labels:
        app: healthz-app
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 3000
        fsGroup: 2000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: app
        image: nginxinc/nginx-unprivileged:1.25
        imagePullPolicy: Always
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
        ports:
        - containerPort: 8080
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080!s
          initialDelaySeconds: 15!s
          periodSeconds: 15!s
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080!s
          initialDelaySeconds: 5!s
          periodSeconds: 10!s
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: cache
          mountPath: /var/cache/nginx
      volumes:
      - name: tmp
        emptyDir: {}
      - name: cache
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: healthz-app
spec:
  selector:
    app: healthz-app
  ports:
  - name: http
    port: 80
    targetPort: 8080
  type: ClusterIP
