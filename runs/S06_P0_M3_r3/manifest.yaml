apiVersion: batch/v1
kind: CronJob
metadata:
  name: nightly-backup
spec:
  schedule: "0 2 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: backup
            image: backup-image:latest
            imagePullPolicy: IfNotPresent
            command: ["/bin/sh", "-c", "echo Running backup...; /usr/local/bin/backup.sh"]
          restartPolicy: OnFailure
