apiVersion: v1
kind: Service
metadata:
  name: stable-service
spec:
  selector:
    app: stable-app
  ports:
  - name: http
    port: 80
    targetPort: 80
  clusterIP: None
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: stable-statefulset
spec:
  selector:
    matchLabels:
      app: stable-app
  serviceName: stable-service
  replicas: 3
  template:
    metadata:
      labels:
        app: stable-app
    spec:
      containers:
      - name: nginx
        image: nginx:1.14.2
        ports:
        - containerPort: 80
