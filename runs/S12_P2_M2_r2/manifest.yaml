apiVersion: apps/v1
kind: Deployment
metadata:
  name: health-checked-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: health-checked-app
  template:
    metadata:
      labels:
        app: health-checked-app
    spec:
      containers:
      - name: app
        image: nginx:1.25
        ports:
        - containerPort: 80
        livenessProbe:
          httpGet:
            path: /healthz
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
