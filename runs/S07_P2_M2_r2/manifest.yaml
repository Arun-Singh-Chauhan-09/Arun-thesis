apiVersion: batch/v1
kind: Job
metadata:
  name: db-migration
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: migration
        image: postgres:15
        command: ["sh", "-c", "psql -h $DB_HOST -U $DB_USER -d $DB_NAME -f /scripts/migrate.sql"]
        env:
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: host
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: user
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: password
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: name
        volumeMounts:
        - name: migration-script
          mountPath: /scripts
          readOnly: true
      volumes:
      - name: migration-script
        configMap:
          name: migration-script
