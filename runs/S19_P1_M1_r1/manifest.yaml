apiVersion: apps/v1
kind: Deployment
metadata:
  name: ssd-deployment
spec:
  selector:
    matchLabels:
      app: ssd-app
  replicas: 1
  template:
    metadata:
      labels:
        app: ssd-app
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: disktype
                operator: In
                values:
                - ssd
      tolerations:
      - key: dedicated
        operator: Equal
        value: batch
        effect: NoSchedule
      containers:
      - name: app
        image: busybox:1.28
        command: ["sleep", "9999"]
