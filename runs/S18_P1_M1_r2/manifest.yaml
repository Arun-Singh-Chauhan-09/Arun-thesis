apiVersion: apps/v1
kind: Deployment
metadata:
  name: spread-deployment
spec:
  selector:
    matchLabels:
      app: spread
  replicas: 3
  template:
    metadata:
      labels:
        app: spread
    spec:
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app: spread
      containers:
      - name: busybox
        image: busybox:1.28
        command: ["/bin/sleep", "10000"]
---
apiVersion: v1
kind: Pod
metadata:
  name: spread-pod
  labels:
    app: spread
spec:
  containers:
  - name: busybox
    image: busybox:1.28
    command: ["/bin/sleep", "10000"]
