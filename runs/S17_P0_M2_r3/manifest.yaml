apiVersion: v1
kind: Service
metadata:
  name: stable-network
spec:
  clusterIP: None
  selector:
    app: stable
  ports:
  - port: 80
    name: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: stable
spec:
  serviceName: stable-network
  replicas: 3
  selector:
    matchLabels:
      app: stable
  template:
    metadata:
      labels:
        app: stable
    spec:
      containers:
      - name: main
        image: nginx:latest
        ports:
        - containerPort: 80
          name: http
