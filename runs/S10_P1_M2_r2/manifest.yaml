apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: log-collection-agent
spec:
  selector:
    matchLabels:
      app: log-collection-agent
  template:
    metadata:
      labels:
        app: log-collection-agent
    spec:
      containers:
      - name: log-collector
        image: fluentd:latest
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        volumeMounts:
        - name: varlog
          mountPath: /var/log
        - name: docker-containers
          mountPath: /var/lib/docker/containers
          readOnly: true
      terminationGracePeriodSeconds: 30
      volumes:
      - name: varlog
        hostPath:
          path: /var/log
      - name: docker-containers
        hostPath:
          path: /var/lib/docker/containers
