apiVersion: v1
kind: Service
metadata:
  name: database
spec:
  selector:
    app: database
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: Pod
metadata:
  name: app-with-init
  labels:
    app: my-app
spec:
  initContainers:
  - name: wait-for-db
    image: busybox:1.36
    command: ['sh', '-c', 'until nslookup database; do echo waiting for database; sleep 2; done']
  containers:
  - name: app
    image: nginx:latest
    ports:
    - containerPort: 80
