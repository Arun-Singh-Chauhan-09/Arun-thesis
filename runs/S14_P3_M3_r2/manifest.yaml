apiVersion: v1
kind: Pod
metadata:
  name: app-with-log-sidecar
  labels:
    app: log-tailing-demo
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 3000
    fsGroup: 2000
    seccompProfile:
      type: RuntimeDefault
  containers:
  - name: main
    image: busybox:1.36
    imagePullPolicy: IfNotPresent
    command:
    - "sh"
    - "-c"
    - >
      while true; do
        echo "$(date -u +'%Y-%m-%dT%H:%M:%SZ') - log entry" >> /var/log/app/app.log;
        sleep 5;
      done
    securityContext:
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: ["ALL"]
      seccompProfile:
        type: RuntimeDefault
    resources:
      requests:
        cpu: "50m"
        memory: "64Mi"
      limits:
        cpu: "200m"
        memory: "128Mi"
    volumeMounts:
    - name: log-volume
      mountPath: /var/log/app
  - name: log-tailer
    image: busybox:1.36
    imagePullPolicy: IfNotPresent
    command:
    - "sh"
    - "-c"
    - "tail -n+1 -F /var/log/app/app.log"
    securityContext:
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: ["ALL"]
      seccompProfile:
        type: RuntimeDefault
    resources:
      requests:
        cpu: "50m"
        memory: "64Mi"
      limits:
        cpu: "200m"
        memory: "128Mi"
    volumeMounts:
    - name: log-volume
      mountPath: /var/log/app
      readOnly: true
  volumes:
  - name: log-volume
    emptyDir: {}
