apiVersion: apps/v1
kind: Deployment
metadata:
  name: healthz-deployment
spec:
  selector:
    matchLabels:
      app: healthz
  replicas: 2
  template:
    metadata:
      labels:
        app: healthz
    spec:
      containers:
      - name: healthz
        image: k8s.gcr.io/busybox
        ports:
        - containerPort: 8080
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: healthz-service
spec:
  selector:
    app: healthz
  ports:
  - name: http
    port: 80
    targetPort: 8080
  type: ClusterIP
