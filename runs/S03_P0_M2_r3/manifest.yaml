---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  application.properties: |
    message=Hello from ConfigMap
    log.level=INFO
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: config-app
  template:
    metadata:
      labels:
        app: config-app
    spec:
      containers:
      - name: app
        image: nginx:1.25
        command: ["/bin/sh", "-c"]
        args:
          - |
            cp /etc/config/application.properties /tmp/app.properties
            cat /tmp/app.properties
            while true; do sleep 3600; done
        volumeMounts:
        - name: config-volume
          mountPath: /etc/config
      volumes:
      - name: config-volume
        configMap:
          name: app-config
