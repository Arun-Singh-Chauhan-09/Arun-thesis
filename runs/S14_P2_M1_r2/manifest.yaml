apiVersion: v1
kind: Pod
metadata:
  name: multi-container-pod
spec:
  containers:
  - name: main-container
    image: busybox
    command: ["sh", "-c"]
    args:
    - while true; do echo "$(date)" >> /var/log/app.log; sleep 5; done
    volumeMounts:
    - name: logs
      mountPath: /var/log
  - name: sidecar-container
    image: busybox
    command: ["sh", "-c"]
    args:
    - tail -f /var/log/app.log
    volumeMounts:
    - name: logs
      mountPath: /var/log
  volumes:
  - name: logs
    emptyDir: {}
---
