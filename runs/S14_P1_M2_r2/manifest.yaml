apiVersion: v1
kind: Pod
metadata:
  name: log-tailer-pod
spec:
  volumes:
    - name: shared-logs
      emptyDir: {}
  containers:
    - name: main-app
      image: alpine:latest
      command: ["/bin/sh", "-c"]
      args:
        - |
          while true; do
            echo "log entry $(date)" >> /var/log/app/app.log
            sleep 5
          done
      volumeMounts:
        - name: shared-logs
          mountPath: /var/log/app
    - name: tailer
      image: alpine:latest
      command: ["/bin/sh", "-c"]
      args:
        - |
          tail -f /var/log/app/app.log
      volumeMounts:
        - name: shared-logs
          mountPath: /var/log/app
