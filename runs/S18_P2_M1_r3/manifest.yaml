apiVersion: apps/v1
kind: Deployment
metadata:
  name: init-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: init-deployment
  template:
    metadata:
      labels:
        app: init-deployment
    spec:
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app: init-deployment
      containers:
      - name: app
        image: nginx:alpine
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: PodDisruptionBudget
metadata:
  name: init-pdb
spec:
  selector:
    matchLabels:
      app: init-deployment
  minAvailable: 2
