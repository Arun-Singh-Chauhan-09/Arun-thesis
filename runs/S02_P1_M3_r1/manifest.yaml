apiVersion: v1
kind: ServiceAccount
metadata:
  name: pod-log-reader-account
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-log-reader-role
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pod-log-reader-binding
subjects:
- kind: ServiceAccount
  name: pod-log-reader-account
roleRef:
  kind: Role
  name: pod-log-reader-role
  apiGroup: rbac.authorization.k8s.io
