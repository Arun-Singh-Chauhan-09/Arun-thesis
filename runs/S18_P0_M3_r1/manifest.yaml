apiVersion: apps/v1
kind: Deployment
metadata:
  name: spread-app
  labels:
    app: spread-app
spec:
  replicas: 6
  selector:
    matchLabels:
      app: spread-app
  template:
    metadata:
      labels:
        app: spread-app
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: spread-app
      containers:
        - name: app
          image: nginx:latest
          ports:
            - containerPort: 80
