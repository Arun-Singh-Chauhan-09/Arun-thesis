apiVersion: v1
kind: Pod
metadata:
  name: multi-container-pod
spec:
  containers:
  - name: main-container
    image: busybox
    volumeMounts:
    - name: shared-logs
      mountPath: /logs
    command: ["sh", "-c"]
    args: ["while true; do echo 'Hello from main container!' >> /logs/main-container.log; sleep 1; done"]
  - name: sidecar-container
    image: busybox
    volumeMounts:
    - name: shared-logs
      mountPath: /logs
    command: ["sh", "-c"]
    args: ["tail -f /logs/main-container.log"]
  volumes:
  - name: shared-logs
    emptyDir: {}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: config-map
data:
  log-file: main-container.log
