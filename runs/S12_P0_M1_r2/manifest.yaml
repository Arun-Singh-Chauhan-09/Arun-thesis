apiVersion: apps/v1
kind: Deployment
metadata:
  name: healthz-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: healthz-app
  template:
    metadata:
      labels:
        app: healthz-app
    spec:
      containers:
      - name: healthz-app
        image: nginx:alpine
        ports:
        - containerPort: 80
        livenessProbe:
          httpGet:
            path: /healthz
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /ready
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: healthz-app
spec:
  selector:
    app: healthz-app
  ports:
  - name: http
    port: 80
    targetPort: 80
  type: ClusterIP
