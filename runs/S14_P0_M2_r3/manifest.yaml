---
apiVersion: v1
kind: Pod
metadata:
  name: log-tailer-pod
spec:
  containers:
  - name: main-app
    image: busybox:1.36
    command: ["/bin/sh", "-c"]
    args:
      - |
        while true; do
          echo "$(date) - main app log entry" >> /var/log/app/app.log
          sleep 5
        done
    volumeMounts:
    - name: log-volume
      mountPath: /var/log/app
  - name: sidecar
    image: busybox:1.36
    command: ["/bin/sh", "-c"]
    args:
      - |
        tail -f /var/log/app/app.log
    volumeMounts:
    - name: log-volume
      mountPath: /var/log/app
  volumes:
  - name: log-volume
    emptyDir: {}
