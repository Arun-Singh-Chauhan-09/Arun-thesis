apiVersion: v1
kind: Pod
metadata:
  name: log-tailer-pod
spec:
  containers:
  - name: main-app
    image: busybox:1.36
    command: ["/bin/sh", "-c"]
    args:
    - while true; do
        echo "Log entry $(date)" >> /var/log/application/app.log;
        sleep 5;
      done
    volumeMounts:
    - name: shared-logs
      mountPath: /var/log/application
  - name: sidecar-tailer
    image: busybox:1.36
    command: ["/bin/sh", "-c"]
    args:
    - tail -F /var/log/application/app.log
    volumeMounts:
    - name: shared-logs
      mountPath: /var/log/application
  volumes:
  - name: shared-logs
    emptyDir: {}
