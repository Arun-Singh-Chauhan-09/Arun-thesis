apiVersion: batch/v1
kind: Job
metadata:
  name: database-migration
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app: database-migration
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: migration
        image: postgres:13
        imagePullPolicy: Always
        command: ["psql", "-U", "postgres", "-d", "database", "-c", "ALTER TABLE table_name ADD COLUMN new_column integer;"]
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "200m"
            memory: "128Mi"
        env:
        - name: PGUSER
          value: "postgres"
        - name: PGPASSWORD
          value: "password"
        - name: PGDATABASE
          value: "database"
        - name: PGHOST
          value: "localhost"
        - name: PGPORT
          value: "5432"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: database-config
data:
  database-url: "localhost:5432"
  database-username: "postgres"
  database-password: "password"
  database-name: "database"
---
apiVersion: v1
kind: Secret
metadata:
  name: database-credentials
type: Opaque
data:
  username: cG9zdGdyZXNxbA==
  password: cGFzc3dvcmQ=
