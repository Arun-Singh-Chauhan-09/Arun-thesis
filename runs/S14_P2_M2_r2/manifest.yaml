apiVersion: v1
kind: Pod
metadata:
  name: log-tailer-pod
  labels:
    app: log-tailer
spec:
  containers:
  - name: main-app
    image: busybox:1.36
    command: ["/bin/sh", "-c"]
    args:
      - |
        echo "Application started" > /var/log/app.log
        while true; do
          echo "$(date): Log entry from main container" >> /var/log/app.log
          sleep 5
        done
    volumeMounts:
    - name: shared-logs
      mountPath: /var/log
  - name: sidecar-tail
    image: busybox:1.36
    command: ["/bin/sh", "-c"]
    args:
      - |
        tail -f /var/log/app.log
    volumeMounts:
    - name: shared-logs
      mountPath: /var/log
  volumes:
  - name: shared-logs
    emptyDir: {}
