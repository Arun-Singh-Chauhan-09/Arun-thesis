apiVersion: v1
kind: ServiceAccount
metadata:
  name: config-reader
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: config-reader
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: config-reader
subjects:
- kind: ServiceAccount
  name: config-reader
roleRef:
  kind: Role
  name: config-reader
  apiGroup: rbac.authorization.k8s.io
