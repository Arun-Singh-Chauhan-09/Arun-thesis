# Wanted: Deployment, StatefulSet, DaemonSet or Pod - a typical, widely-upvoted but UNHARDENED manifest - the kind of quick answer practitioners copy most often
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
spec:
  selector:
    matchLabels:
      app: nginx
  replicas: 2 # tells deployment to run 2 pods matching the template
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: nginx:1.14.2
        ports:
        - containerPort: 80
