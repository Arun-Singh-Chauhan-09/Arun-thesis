apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup-cronjob
spec:
  schedule: 0 2 * * *
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
          - name: backup
            image: backup:latest
            command:
            - /bin/sh
            - -c
            - echo 'Backup started'; sleep 10; echo 'Backup completed'
            securityContext:
              runAsNonRoot: true
              runAsUser: 10001
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                - ALL
              seccompProfile:
                type: RuntimeDefault
            resources:
              limits:
                memory: 256Mi
                cpu: 500m
              requests:
                memory: 128Mi
                cpu: 100m
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          automountServiceAccountToken: false
