apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  config.yaml: "app:\n  name: sample-app\n  environment: production\n  log_level:\
    \ info\nsettings:\n  max_connections: 100\n  timeout_seconds: 30\n"
  app.properties: 'key1=value1

    key2=value2

    '
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-reader-app
  labels:
    app: config-reader-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: config-reader-app
  template:
    metadata:
      labels:
        app: config-reader-app
    spec:
      containers:
      - name: config-reader-app
        image: busybox:1.36
        command:
        - sh
        - -c
        - cat /etc/config/config.yaml && sleep 3600
        volumeMounts:
        - name: config-volume
          mountPath: /etc/config
          readOnly: true
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        resources:
          limits:
            memory: 256Mi
            cpu: 500m
          requests:
            memory: 128Mi
            cpu: 100m
      volumes:
      - name: config-volume
        configMap:
          name: app-config
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
