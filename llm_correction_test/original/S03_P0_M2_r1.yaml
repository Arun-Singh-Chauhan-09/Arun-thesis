---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  config.yaml: |
    app:
      name: my-app
      version: 1.0.0
    database:
      host: localhost
      port: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-reader-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: config-reader
  template:
    metadata:
      labels:
        app: config-reader
    spec:
      containers:
      - name: app
        image: busybox
        command: ["/bin/sh", "-c"]
        args:
          - while true; do cat /etc/config/config.yaml; sleep 10; done
        volumeMounts:
        - name: config-volume
          mountPath: /etc/config
      volumes:
      - name: config-volume
        configMap:
          name: app-config
